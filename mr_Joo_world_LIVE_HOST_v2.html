<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>mr Joo world — LIVE QUIZ</title>
<style>
:root{
 --red:#ff1744;--red2:#ff3b30;--blue:#00b7ff;--yellow:#ffd21f;
 --bg:#050608;--panel:#0b0e13;--panel2:#11151d;--line:#252b35;
 --text:#f5f7fa;--muted:#7e8998;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;min-height:100%;background:#050608;color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif}
body{overflow-x:hidden}
button,input{font:inherit}
.app{min-height:100vh;display:flex;flex-direction:column;
background:
radial-gradient(900px 500px at 15% -10%,#ff17440f,transparent 60%),
radial-gradient(800px 500px at 100% 0%,#00b7ff0d,transparent 60%),
var(--bg)}
.top{height:70px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;
border-bottom:1px solid var(--line);background:#050608ee;backdrop-filter:blur(18px);position:sticky;top:0;z-index:20}
.logo{font-size:21px;font-weight:950;letter-spacing:-.5px}
.logo span{color:var(--red)}
.live{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:900;letter-spacing:1.5px;color:#fff}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 15px var(--red);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.host{color:var(--muted);font-size:11px;font-weight:700}
.stage{width:min(980px,100%);margin:auto;padding:16px 14px 22px;flex:1}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;font-weight:800;
letter-spacing:.5px;margin:2px 2px 12px}
.category{color:var(--blue);text-transform:uppercase}
.round{color:#aeb6c2}
.timerWrap{display:flex;justify-content:center;margin:4px 0 16px}
.timer{width:112px;height:112px;border-radius:50%;position:relative;display:grid;place-items:center;
background:conic-gradient(var(--yellow) var(--pct),#1b2028 0);box-shadow:0 0 40px #ffd21f18}
.timer:before{content:"";position:absolute;inset:7px;border-radius:50%;background:#080a0e;border:1px solid #242a33}
.time{position:relative;z-index:2;font-size:38px;font-weight:1000;letter-spacing:-2px}
.timer.fast{background:conic-gradient(var(--red) var(--pct),#26151a 0);box-shadow:0 0 42px #ff17442b;animation:timerPulse .42s infinite alternate}
.timer.fast .time{color:#fff}
@keyframes timerPulse{to{transform:scale(1.045)}}
.questionPanel{min-height:46vh;border:1px solid #252b35;border-radius:25px;background:
linear-gradient(180deg,#12161d,#090b0f);box-shadow:0 28px 80px #0009;
padding:26px 20px 20px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.questionPanel:before{content:"";position:absolute;inset:0;pointer-events:none;background:
linear-gradient(115deg,transparent 0 35%,#ffffff03 35% 36%,transparent 36% 100%)}
.qLabel{font-size:10px;color:#687384;letter-spacing:2px;font-weight:950;text-align:center;margin-bottom:15px}
.question{font-size:clamp(28px,6vw,60px);line-height:1.22;letter-spacing:-1.4px;font-weight:950;text-align:center;max-width:900px;margin:0 auto}
.answer{margin:22px auto 0;max-width:850px;text-align:center;font-size:clamp(23px,4.4vw,40px);
font-weight:950;color:var(--yellow);display:none}
.answer.show{display:block;animation:answerIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes answerIn{0%{opacity:0;transform:translateY(15px) scale(.92)}100%{opacity:1;transform:none}}
.status{min-height:42px;display:flex;align-items:center;justify-content:center;margin-top:16px;color:#9ba6b5;font-size:12px;font-weight:800}
.winner{display:none;align-items:center;justify-content:center;gap:9px;margin:12px auto 0;padding:9px 14px;border:1px solid #ffd21f44;
background:#ffd21f0d;border-radius:999px;color:#cbd1da;font-size:12px;font-weight:800}
.winner.show{display:flex;animation:wIn .4s ease}
.winner b{color:var(--yellow);font-size:15px}
@keyframes wIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:15px}
.btn{min-height:52px;border-radius:14px;border:1px solid var(--line);background:#121720;color:#fff;font-weight:900;font-size:13px}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--red);border-color:var(--red);box-shadow:0 8px 28px #ff17442b}
.btn.yellow{background:var(--yellow);color:#08090b;border-color:var(--yellow)}
.hostbar{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:9px}
.name{min-width:0;width:100%;height:48px;border-radius:13px;border:1px solid var(--line);outline:none;
background:#080b10;color:#fff;text-align:center;padding:0 13px;font-weight:800}
.name:focus{border-color:#485364}
.sound{width:48px;border-radius:13px;border:1px solid var(--line);background:#0d1219;color:#fff;font-size:18px}
.bottom{display:flex;justify-content:space-between;align-items:center;color:#586372;font-size:10px;font-weight:800;padding:12px 2px 0}
.explosion,.timeout{position:fixed;inset:0;display:none;pointer-events:none;z-index:50;align-items:center;justify-content:center}
.explosion.on{display:flex;animation:flash .7s ease-out}
.explosion:after{content:"✓";width:140px;height:140px;border-radius:50%;display:grid;place-items:center;
font-size:75px;font-weight:1000;color:#111;background:var(--yellow);box-shadow:0 0 0 20px #ffd21f22,0 0 100px #ffd21f88;animation:boom .65s ease-out}
@keyframes flash{0%{background:#ffd21f88}100%{background:transparent}}
@keyframes boom{0%{transform:scale(.15);opacity:0}45%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:0}}
.timeout.on{display:flex;animation:fade .9s ease-out}
.timeout:after{content:"TIME";font-size:clamp(60px,16vw,150px);font-weight:1000;color:#fff;
text-shadow:0 0 40px #ff1744;animation:shake .5s ease-in-out}
@keyframes fade{0%{background:#ff174455}100%{background:transparent}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
@media(max-width:600px){
 .top{height:60px;padding:0 14px}.logo{font-size:19px}.host{display:none}
 .stage{padding:12px 11px 16px}.timer{width:98px;height:98px}.timer:before{inset:6px}.time{font-size:33px}
 .questionPanel{min-height:52vh;border-radius:21px;padding:23px 15px 16px}
 .controls{grid-template-columns:1fr 1fr}.btn.next{grid-column:1/-1}
 .bottom{font-size:9px}
}
</style></head>
<body><div class="app">
<header class="top"><div class="logo">mr Joo <span>world</span></div><div class="live"><i class="dot"></i> LIVE HOST MODE</div><div class="host">MANUAL CONTROL</div></header>
<main class="stage">
<div class="meta"><span class="category" id="cat">—</span><span class="round" id="num">01 / 500</span></div>
<div class="timerWrap"><div class="timer" id="timer" style="--pct:100%"><div class="time" id="sec">60</div></div></div>
<section class="questionPanel">
<div class="qLabel">THE CHALLENGE</div><div class="question" id="q">جاهز؟</div>
<div class="answer" id="a"></div><div class="status" id="status">اضغط «ابدأ» عندما تكون جاهزًا</div>
<div class="winner" id="winner">👑 <span>تم اختيار</span> <b id="winnerName"></b></div>
<div class="controls">
<button class="btn yellow" id="start">▶ ابدأ 60 ثانية</button>
<button class="btn" id="reveal">كشف الإجابة</button>
<button class="btn next primary" id="next">السؤال التالي ⟵</button>
</div>
<div class="hostbar"><input class="name" id="name" placeholder="اكتب اسم صاحب الإجابة من الكومنتات"><button class="sound" id="mute">🔊</button></div>
</section>
<div class="bottom"><span>500 CHALLENGES</span><span>mr Joo world</span><span>HOST CONTROLLED</span></div>
</main></div>
<div class="explosion" id="explosion"></div><div class="timeout" id="timeout"></div>

let idx=0,left=60,running=false,answered=false,timerId=null,muted=false;
const $=id=>document.getElementById(id);
function beep(type){
 if(muted)return;
 try{
  const C=window.AudioContext||window.webkitAudioContext; if(!C)return;
  const c=new C(),o=c.createOscillator(),g=c.createGain();
  o.connect(g);g.connect(c.destination);
  o.frequency.value=type==="ok"?720:type==="tick"?900:180;
  g.gain.value=.045;o.start();o.stop(c.currentTime+(type==="ok"?.22:.08));
 }catch(e){}
}
function draw(){
 const x=QUESTIONS[idx];
 $("cat").textContent=x.category.toUpperCase();
 $("num").textContent=String(idx+1).padStart(2,"0")+" / 500";
 $("q").textContent=x.question;$("a").textContent="الإجابة: "+x.answer;
 $("a").classList.remove("show");$("winner").classList.remove("show");
 $("status").textContent="اضغط «ابدأ» عندما تكون جاهزًا";
 left=60;running=false;answered=false;paint();clearInterval(timerId);
}
function paint(){
 $("sec").textContent=left;$("timer").style.setProperty("--pct",(left/60*100)+"%");
 $("timer").classList.toggle("fast",left<=15&&left>0);
}
function start(){
 if(running)return;
 running=true;answered=false;$("status").textContent="الوقت بدأ — أسرع إجابة تكسب";
 clearInterval(timerId);
 timerId=setInterval(()=>{
   if(!running)return; left--;paint();
   if(left<=15&&left>0) beep("tick");
   if(left<=0){running=false;answered=true;clearInterval(timerId);$("a").classList.add("show");
      $("status").textContent="انتهى الوقت — لا إجابة";$("timeout").classList.add("on");
      setTimeout(()=>$("timeout").classList.remove("on"),900);}
 },1000);
}
function reveal(){
 if(answered && !running)return;
 running=false;clearInterval(timerId);answered=true;$("a").classList.add("show");
 $("status").textContent="تم كشف الإجابة";$("explosion").classList.add("on");
 setTimeout(()=>$("explosion").classList.remove("on"),700);beep("ok");
}
function honor(){
 const n=$("name").value.trim(); if(!n)return;
 $("winnerName").textContent=n;$("winner").classList.add("show");
 $("status").textContent="👑 تم تكريم صاحب الإجابة";
 reveal();
}
$("start").onclick=start;
$("reveal").onclick=reveal;
$("next").onclick=()=>{idx=(idx+1)%QUESTIONS.length;draw()};
$("name").addEventListener("keydown",e=>{if(e.key==="Enter")honor()});
$("name").addEventListener("dblclick",honor);
$("winner").onclick=honor;
$("mute").onclick=()=>{muted=!muted;$("mute").textContent=muted?"🔇":"🔊"};
draw();
</script></body></html>
